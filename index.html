<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A0A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Léo Personal">
<title>Léo Personal</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --fs:#C8A020;--fs-lt:#2A2400;--fs-dk:#FFD54F;
  --ic:#E05050;--ic-lt:#2A1010;--ic-dk:#FF8A80;
  --pr:#4090E0;--pr-lt:#101A2A;--pr-dk:#82B1FF;
  --cd:#9060E0;--cd-lt:#1A1028;--cd-dk:#CE93D8;
  --g1:#00C896;--g2:#00A87A;--g4:#001A12;--g5:#00E0A0;
  --red:#E05050;--red-lt:#1A0808;--amber:#C87020;--amber-lt:#1A0E00;
  --bg:#0A0A0A;--bg2:#111;--bg3:#181818;--card:#141414;
  --border:#2A2A2A;--border2:#333;
  --text:#F0F0F0;--muted:#888;--faint:#444;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'SF Mono','Courier New',monospace;
  --r:14px;--r-sm:8px;--r-xs:4px;--r-pill:100px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100dvh;max-width:480px;margin:0 auto;background:var(--bg);overflow:hidden}
/* Splash */
.splash{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .5s,transform .5s}
.splash.hide{opacity:0;transform:scale(1.05);pointer-events:none}
.splash-logo{font-size:36px;font-weight:700;letter-spacing:-1px}
.splash-logo span{color:var(--g1)}
.splash-sub{font-size:11px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
.splash-ring{width:40px;height:40px;border:2px solid var(--border2);border-top-color:var(--g1);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Header */
.hdr{background:var(--bg2);padding:16px 16px 0;flex-shrink:0;border-bottom:.5px solid var(--border)}
.hdr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.hdr-logo{font-size:18px;font-weight:700;letter-spacing:-.5px}
.hdr-logo span{color:var(--g1)}
.hdr-sub{font-size:9px;color:var(--muted);font-family:var(--mono);margin-top:3px}
.hdr-date{font-size:10px;color:var(--muted);font-family:var(--mono);text-align:right}
.hdr-count{font-size:9px;color:var(--faint);margin-top:2px;text-align:right}
.hdr-kpis{display:flex;gap:5px;margin-bottom:10px}
.hkpi{flex:1;background:var(--bg3);border-radius:var(--r-sm);padding:8px 5px;text-align:center;border:.5px solid var(--border);cursor:pointer}
.hkpi-v{font-size:16px;font-weight:700;font-family:var(--mono);line-height:1}
.hkpi-l{font-size:8px;color:var(--muted);margin-top:3px}
.hkpi.fs .hkpi-v{color:var(--fs-dk)}.hkpi.ic .hkpi-v{color:var(--ic-dk)}
.hkpi.pr .hkpi-v{color:var(--pr-dk)}.hkpi.cd .hkpi-v{color:var(--cd-dk)}.hkpi.rec .hkpi-v{color:var(--g1)}
.month-strip{display:flex;gap:2px;padding-bottom:12px;overflow-x:auto;scrollbar-width:none}
.month-strip::-webkit-scrollbar{display:none}
.m-tab{padding:5px 10px;border-radius:var(--r-pill);font-size:10px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--muted);border:none;background:none}
.m-tab.active{background:var(--g1);color:#000;font-weight:700}
/* Screens */
.screens{flex:1;overflow:hidden;position:relative}
.screen{position:absolute;inset:0;overflow-y:auto;display:none;padding-bottom:72px}
.screen.active{display:block}
/* Nav */
.bnav{display:flex;border-top:.5px solid var(--border);flex-shrink:0;background:var(--bg2)}
.nb{flex:1;padding:8px 2px 10px;text-align:center;cursor:pointer;font-size:9px;color:var(--faint);border:none;background:none}
.nb svg{display:block;margin:0 auto 3px;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5}
.nb.active{color:var(--g1)}
/* Home */
.home-pad{padding:16px 14px}
.greeting{font-size:22px;font-weight:700;letter-spacing:-.5px;margin-bottom:3px}
.greeting span{color:var(--g1)}
.greeting-sub{font-size:12px;color:var(--muted);margin-bottom:16px}
.alert-card{border-radius:var(--r);padding:12px 14px;margin-bottom:10px;display:flex;align-items:flex-start;gap:10px;border-left:3px solid}
.alert-card.danger{background:var(--red-lt);border-color:var(--red)}
.alert-card.info{background:var(--g4);border-color:var(--g1)}
.alert-card.warn{background:var(--amber-lt);border-color:var(--amber)}
.alert-icon{font-size:16px;flex-shrink:0}
.alert-text{font-size:12px;font-weight:600}
.alert-sub{font-size:11px;color:var(--muted);margin-top:2px}
.today-card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px;border:.5px solid var(--border)}
.today-title{font-size:11px;font-weight:700;color:var(--g1);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.today-slot{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--border)}
.today-slot:last-child{border:none}
.ts-time{font-size:10px;font-family:var(--mono);color:var(--faint);width:32px;flex-shrink:0}
.ts-name{font-size:13px;font-weight:500;flex:1}
.ts-loc{font-size:9px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:var(--r-xs)}
.ts-loc.fs{background:var(--fs-lt);color:var(--fs-dk)}.ts-loc.ic{background:var(--ic-lt);color:var(--ic-dk)}
.ts-loc.pr{background:var(--pr-lt);color:var(--pr-dk)}.ts-loc.cd{background:var(--cd-lt);color:var(--cd-dk)}
.today-empty{font-size:12px;color:var(--faint);text-align:center;padding:12px 0;font-style:italic}
.fin-mini{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.fmc{background:var(--card);border-radius:var(--r);padding:12px 10px;border:.5px solid var(--border)}
.fmc-v{font-size:15px;font-weight:700;font-family:var(--mono);line-height:1}
.fmc-l{font-size:9px;color:var(--muted);margin-top:4px}
.fmc.rec .fmc-v{color:var(--g1)}.fmc.pend .fmc-v{color:var(--amber)}.fmc.atras .fmc-v{color:var(--red)}
.chart-card{background:var(--card);border-radius:var(--r);padding:14px;border:.5px solid var(--border)}
.chart-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.chart-bars{display:flex;align-items:flex-end;gap:3px;height:80px}
.cb{flex:1;background:var(--bg3);border-radius:3px 3px 0 0;position:relative;min-height:3px;cursor:pointer}
.cb.filled{background:var(--border2)}.cb.cur{background:var(--g1)}
.cb-label{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
.chart-axis{height:16px}
/* Calendário */
.cal-wrap{padding:14px}
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.cal-nav{display:flex;gap:4px}
.cal-nav-btn{width:30px;height:30px;border:none;background:var(--bg3);border-radius:var(--r-sm);cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;border:.5px solid var(--border)}
.cal-nav-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.cal-grid-hdr{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:6px}
.cal-dn{text-align:center;font-size:10px;font-weight:600;color:var(--faint);padding:4px 0;font-family:var(--mono)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day{aspect-ratio:1;border-radius:var(--r-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;border:.5px solid transparent;transition:all .1s;min-height:40px}
.cal-day:hover:not(.empty):not(.wknd){border-color:var(--g2);background:var(--bg3)}
.cal-day.empty{cursor:default}.cal-day.wknd{opacity:.3;cursor:default}
.cal-day.today{border-color:var(--g1)!important;background:var(--g4)}
.cal-day.has-a{background:var(--bg3)}
.cal-day.sel{border-color:var(--g1);background:var(--g4)}
.cal-day-num{font-size:11px;font-weight:500;font-family:var(--mono)}
.cal-day.today .cal-day-num,.cal-day.sel .cal-day-num{color:var(--g1);font-weight:700}
.cal-dots{display:flex;gap:2px;margin-top:3px;justify-content:center;flex-wrap:wrap;max-width:26px}
.cdot{width:5px;height:5px;border-radius:50%}
.cdot.fs{background:var(--fs-dk)}.cdot.ic{background:var(--ic-dk)}.cdot.pr{background:var(--pr-dk)}.cdot.cd{background:var(--cd-dk)}
.cal-cnt{position:absolute;top:3px;right:4px;font-size:8px;font-family:var(--mono);color:var(--g1);font-weight:700}
.day-detail{background:var(--card);border-radius:var(--r);padding:14px;margin-top:10px;border:.5px solid var(--border);animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.dd-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.dd-close{font-size:20px;color:var(--faint);cursor:pointer;background:none;border:none;line-height:1;flex-shrink:0}
.dd-badges{display:flex;gap:5px;flex-wrap:wrap}
.dd-badge{font-size:9px;font-family:var(--mono);font-weight:700;padding:2px 7px;border-radius:var(--r-xs)}
.dd-badge.fs{background:var(--fs-lt);color:var(--fs-dk)}.dd-badge.ic{background:var(--ic-lt);color:var(--ic-dk)}
.dd-badge.pr{background:var(--pr-lt);color:var(--pr-dk)}.dd-badge.cd{background:var(--cd-lt);color:var(--cd-dk)}
.slot-q{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:.5px solid var(--border)}
.slot-q:last-child{border:none}
.sq-time{font-size:10px;font-family:var(--mono);color:var(--faint);width:32px;flex-shrink:0}
.sq-btn{flex:1;padding:7px 10px;border-radius:var(--r-sm);border:.5px solid var(--border);background:var(--bg3);cursor:pointer;display:flex;align-items:center;gap:8px;text-align:left;transition:all .1s}
.sq-btn:hover{border-color:var(--g1);background:var(--g4)}
.sq-btn.filled{border-style:solid}
.sq-btn.fs{background:var(--fs-lt);border-color:var(--fs)}.sq-btn.ic{background:var(--ic-lt);border-color:var(--ic)}
.sq-btn.pr{background:var(--pr-lt);border-color:var(--pr)}.sq-btn.cd{background:var(--cd-lt);border-color:var(--cd)}
.sq-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sq-dot.fs{background:var(--fs-dk)}.sq-dot.ic{background:var(--ic-dk)}.sq-dot.pr{background:var(--pr-dk)}.sq-dot.cd{background:var(--cd-dk)}
.sq-name{font-size:12px;font-weight:500;flex:1}
.sq-empty{font-size:12px;color:var(--faint)}
.sq-del{margin-left:auto;color:var(--faint);font-size:16px;cursor:pointer;background:none;border:none;line-height:1;padding:0 4px}
.sq-del:hover{color:var(--red)}
/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border-radius:20px 20px 0 0;padding:16px 16px 28px;width:100%;max-width:480px;max-height:85dvh;display:flex;flex-direction:column;animation:su .25s ease;border-top:.5px solid var(--border)}
@keyframes su{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.mh{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 14px}
.m-title{font-size:17px;font-weight:700;margin-bottom:2px}
.m-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:12px}
.m-search{width:100%;padding:10px 14px;border:.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;outline:none;background:var(--bg3);color:var(--text);margin-bottom:10px}
.m-search:focus{border-color:var(--g1)}
.m-list{overflow-y:auto;flex:1}
.m-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:var(--r-sm);cursor:pointer}
.m-item:hover{background:var(--bg3)}
.m-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.m-name{font-size:13px;font-weight:500;flex:1}
.m-sub-nm{font-size:10px;color:var(--muted)}
.m-loc{font-size:10px;font-family:var(--mono);font-weight:700;padding:3px 8px;border-radius:var(--r-xs)}
.m-loc.fs{background:var(--fs-lt);color:var(--fs-dk)}.m-loc.ic{background:var(--ic-lt);color:var(--ic-dk)}
.m-loc.pr{background:var(--pr-lt);color:var(--pr-dk)}.m-loc.cd{background:var(--cd-lt);color:var(--cd-dk)}
.m-clear{text-align:center;padding:12px;font-size:12px;color:var(--muted);cursor:pointer;border-top:.5px solid var(--border);margin-top:8px}
.m-clear:hover{color:var(--red)}
/* Ficha */
.ficha-modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:300;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.ficha-modal.open{display:flex}
.ficha-inner{background:var(--bg2);border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:93dvh;display:flex;flex-direction:column;animation:su .25s ease;border-top:.5px solid var(--border)}
.ficha-hdr{padding:16px 18px 12px;border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.ficha-av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0}
.ficha-hdr-title{font-size:17px;font-weight:700;letter-spacing:-.3px}
.ficha-hdr-sub{font-size:11px;color:var(--muted);margin-top:3px}
.ficha-close{font-size:24px;color:var(--faint);cursor:pointer;background:none;border:none;line-height:1;padding:0 4px}
.ficha-tabs{display:flex;background:var(--bg2);border-bottom:.5px solid var(--border);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.ficha-tabs::-webkit-scrollbar{display:none}
.ftab{flex-shrink:0;padding:11px 14px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.ftab.active{color:var(--g1);border-bottom-color:var(--g1);font-weight:700}
.ficha-body{overflow-y:auto;flex:1;padding:16px}
.fsec{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:10px;margin-top:16px;text-transform:uppercase}
.fsec:first-child{margin-top:0}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.ff{display:flex;flex-direction:column;gap:5px}.ff.full{grid-column:1/-1}
.fl{font-size:10px;color:var(--muted);font-weight:500}
.fi{padding:9px 11px;border:.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;outline:none;background:var(--bg3);color:var(--text);width:100%}
.fi:focus{border-color:var(--g1)}
.fs-el{padding:9px 11px;border:.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;outline:none;background:var(--bg3);color:var(--text);width:100%;cursor:pointer}
.fs-el:focus{border-color:var(--g1)}
.fta{padding:9px 11px;border:.5px solid var(--border);border-radius:var(--r-sm);font-size:12px;outline:none;background:var(--bg3);color:var(--text);width:100%;resize:vertical;min-height:70px;line-height:1.5}
.fta:focus{border-color:var(--g1)}
.save-btn{width:100%;padding:13px;background:var(--g1);color:#000;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer;margin-top:16px}
.save-btn:hover{background:var(--g5)}
.del-btn{width:100%;padding:12px;background:none;color:var(--red);border:.5px solid var(--red-lt);border-radius:var(--r-sm);font-size:13px;cursor:pointer;margin-top:8px}
/* Gráfico evolução */
.evo-card{background:var(--bg3);border-radius:var(--r-sm);padding:14px;margin-bottom:10px;border:.5px solid var(--border)}
.evo-title{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.evo-labels{display:flex;justify-content:space-between;margin-top:4px}
.evo-lbl{font-size:9px;color:var(--faint);font-family:var(--mono)}
.mh-entry{background:var(--bg3);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:5px;border:.5px solid var(--border);display:flex;align-items:flex-start;gap:10px}
.mh-date{font-size:10px;font-family:var(--mono);color:var(--muted);flex-shrink:0;width:52px}
.mh-chips{flex:1;display:flex;flex-wrap:wrap;gap:5px}
.mh-chip{font-size:11px;background:var(--bg2);padding:2px 8px;border-radius:var(--r-xs)}
.mh-del{font-size:16px;color:var(--faint);cursor:pointer;background:none;border:none;line-height:1}
.mh-del:hover{color:var(--red)}
/* Alunos */
.al-pad{padding:14px}
.al-search{width:100%;padding:11px 14px;border:.5px solid var(--border);border-radius:var(--r-pill);font-size:13px;outline:none;background:var(--bg3);color:var(--text);margin-bottom:12px}
.al-search:focus{border-color:var(--g1)}
.al-card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;border:.5px solid var(--border);cursor:pointer;transition:border .15s}
.al-card:hover{border-color:var(--g2)}
.al-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.al-name{font-size:14px;font-weight:600;letter-spacing:-.2px}
.al-sub{font-size:11px;color:var(--muted);margin-top:2px}
.al-loc{font-size:10px;font-family:var(--mono);font-weight:700;padding:3px 8px;border-radius:var(--r-xs)}
.al-loc.fs{background:var(--fs-lt);color:var(--fs-dk)}.al-loc.ic{background:var(--ic-lt);color:var(--ic-dk)}
.al-loc.pr{background:var(--pr-lt);color:var(--pr-dk)}.al-loc.cd{background:var(--cd-lt);color:var(--cd-dk)}
.add-fab{position:sticky;bottom:16px;float:right;width:48px;height:48px;border-radius:50%;background:var(--g1);color:#000;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,200,150,.4);margin-top:10px}
/* Financeiro */
.fin-pad{padding:14px}
.fin-sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.fsc{background:var(--card);border-radius:var(--r);padding:12px;border:.5px solid var(--border)}
.fsc-v{font-size:17px;font-weight:700;font-family:var(--mono);line-height:1}
.fsc-l{font-size:9px;color:var(--muted);margin-top:4px}
.fsc.rec .fsc-v{color:var(--g1)}.fsc.pend .fsc-v{color:var(--amber)}.fsc.atras .fsc-v{color:var(--red)}
.sec-t{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:10px;text-transform:uppercase}
.pay-card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;border:.5px solid var(--border)}
.pay-top{display:flex;align-items:center;gap:10px}
.pay-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.pay-info{flex:1}
.pay-name{font-size:13px;font-weight:600}
.pay-meta{font-size:10px;color:var(--muted);margin-top:2px}
.pay-status{font-size:10px;font-weight:700;padding:4px 12px;border-radius:var(--r-pill);cursor:pointer;border:none;font-family:var(--mono)}
.pay-status.pago{background:var(--g4);color:var(--g1)}.pay-status.pendente{background:var(--amber-lt);color:var(--amber)}.pay-status.atrasado{background:var(--red-lt);color:var(--red)}
.pay-bottom{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:.5px solid var(--border)}
.pay-val-in{width:95px;padding:6px 9px;border:.5px solid var(--border);border-radius:var(--r-xs);font-size:12px;font-family:var(--mono);outline:none;background:var(--bg3);color:var(--text);text-align:right}
.pay-val-in:focus{border-color:var(--g1)}
.nf-check{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);cursor:pointer;flex:1}
.nf-check input{width:15px;height:15px;cursor:pointer;accent-color:var(--g1)}
.nf-check.done{color:var(--g1);font-weight:600}
.recibo-btn{font-size:11px;color:var(--muted);cursor:pointer;background:none;border:.5px solid var(--border);padding:4px 10px;border-radius:var(--r-xs)}
.recibo-btn:hover{border-color:var(--g1);color:var(--g1)}
.export-btn{width:100%;padding:12px;background:var(--bg3);color:var(--g1);border:.5px solid var(--g2);border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.export-btn:hover{background:var(--g4)}
/* Dashboard */
.dash-pad{padding:14px}
.sec{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;margin-bottom:10px;margin-top:18px;text-transform:uppercase}
.sec:first-child{margin-top:0}
.kpi-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.kpi{background:var(--card);border-radius:var(--r);padding:13px 14px;border:.5px solid var(--border)}
.kpi-v{font-size:26px;font-weight:700;font-family:var(--mono);line-height:1;letter-spacing:-.5px}
.kpi-l{font-size:9px;color:var(--muted);margin-top:4px}
.kpi.fs .kpi-v{color:var(--fs-dk)}.kpi.ic .kpi-v{color:var(--ic-dk)}.kpi.pr .kpi-v{color:var(--pr-dk)}.kpi.cd .kpi-v{color:var(--cd-dk)}.kpi.tot .kpi-v{color:var(--g1)}
.bar-r{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bar-l{font-size:11px;font-weight:700;font-family:var(--mono);width:26px}
.bar-l.fs{color:var(--fs-dk)}.bar-l.ic{color:var(--ic-dk)}.bar-l.pr{color:var(--pr-dk)}.bar-l.cd{color:var(--cd-dk)}
.bar-bg{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden}
.bar-f{height:100%;border-radius:4px}
.bar-f.fs{background:var(--fs-dk)}.bar-f.ic{background:var(--ic-dk)}.bar-f.pr{background:var(--pr-dk)}.bar-f.cd{background:var(--cd-dk)}
.bar-n{font-size:10px;font-family:var(--mono);color:var(--muted);width:20px;text-align:right}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border-radius:var(--r-sm);margin-bottom:5px;border:.5px solid var(--border)}
.rank-pos{font-size:14px;width:26px;text-align:center;flex-shrink:0}
.rank-name{font-size:12px;font-weight:500;flex:1}
.rank-sub-d{font-size:10px;color:var(--muted)}
.rank-val{font-size:13px;font-family:var(--mono);color:var(--g1);font-weight:700}
.aniv-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border-radius:var(--r-sm);margin-bottom:5px;border:.5px solid var(--border)}
.aniv-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.aniv-name{font-size:12px;font-weight:500;flex:1}
.aniv-date{font-size:10px;color:var(--muted);font-family:var(--mono)}
.aniv-badge{font-size:9px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill)}
.aniv-badge.hoje{background:var(--g4);color:var(--g1)}.aniv-badge.prox{background:var(--amber-lt);color:var(--amber)}
.af-r{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.af-n{font-size:11px;font-weight:500;width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.af-bg{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.af-f{height:100%;border-radius:3px}
.af-c{font-size:10px;font-family:var(--mono);color:var(--muted);width:20px;text-align:right}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--bg2);color:var(--text);padding:9px 20px;border-radius:var(--r-pill);font-size:12px;z-index:500;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;border:.5px solid var(--border2)}
.toast.show{opacity:1}
.sync-dot{position:fixed;top:14px;right:14px;width:7px;height:7px;border-radius:50%;background:var(--g1);z-index:100;opacity:0;transition:opacity .3s;box-shadow:0 0 8px var(--g1)}
.sync-dot.show{opacity:1}

/* Status aluno */
.status-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill);font-family:var(--mono);letter-spacing:.04em}
.status-badge.ativo{background:var(--g4);color:var(--g1)}
.status-badge.pausado{background:var(--amber-lt);color:var(--amber)}
.status-badge.ferias{background:var(--pr-lt);color:var(--pr-dk)}
.status-badge.cancelado{background:var(--red-lt);color:var(--red)}
/* Aniversários do mês */
.aniv-mes-card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px;border:.5px solid var(--border)}
.aniv-mes-title{font-size:11px;font-weight:700;color:var(--amber);margin-bottom:10px;letter-spacing:.06em;text-transform:uppercase}
.aniv-mes-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border)}
.aniv-mes-row:last-child{border:none}
.aniv-mes-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.aniv-mes-info{flex:1}
.aniv-mes-nome{font-size:13px;font-weight:500}
.aniv-mes-data{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:1px}
.aniv-mes-btn{font-size:11px;color:var(--g1);cursor:pointer;background:none;border:.5px solid var(--g2);padding:4px 10px;border-radius:var(--r-xs)}
.aniv-mes-btn:hover{background:var(--g4)}
/* Despesas */
.desp-card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;border:.5px solid var(--border);display:flex;align-items:center;gap:10px}
.desp-nome{font-size:13px;font-weight:500;flex:1}
.desp-cat{font-size:9px;font-family:var(--mono);color:var(--muted);margin-top:2px}
.desp-val{font-size:13px;font-family:var(--mono);color:var(--red);font-weight:600}
.desp-del{font-size:18px;color:var(--faint);cursor:pointer;background:none;border:none;line-height:1;padding:0 4px}
.desp-del:hover{color:var(--red)}
.desp-form{background:var(--bg3);border-radius:var(--r);padding:14px;border:.5px solid var(--border);margin-top:10px}
.desp-form-title{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.lucro-card{border-radius:var(--r);padding:14px;margin-bottom:14px;border:.5px solid var(--border);display:flex;align-items:center;gap:12px}
.lucro-card.positivo{background:var(--g4);border-color:var(--g2)}
.lucro-card.negativo{background:var(--red-lt);border-color:var(--red)}
.lucro-val{font-size:24px;font-weight:700;font-family:var(--mono);flex:1}
.lucro-card.positivo .lucro-val{color:var(--g1)}
.lucro-card.negativo .lucro-val{color:var(--red)}
.lucro-lbl{font-size:11px;color:var(--muted)}
/* Histórico presença */
.pres-bar-wrap{display:flex;align-items:flex-end;gap:4px;height:60px;margin-bottom:6px}
.pres-bar{flex:1;background:var(--bg3);border-radius:3px 3px 0 0;position:relative;min-height:3px;transition:height .4s}
.pres-bar.cur{background:var(--g1)}.pres-bar.old{background:var(--border2)}
.pres-bar-lbl{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:7px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
.pres-axis{height:16px}
.pres-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.pres-stat{background:var(--bg3);border-radius:var(--r-sm);padding:10px;text-align:center;border:.5px solid var(--border)}
.pres-stat-v{font-size:20px;font-weight:700;font-family:var(--mono);color:var(--g1);line-height:1}
.pres-stat-l{font-size:9px;color:var(--muted);margin-top:3px}
/* WhatsApp btn */
.wpp-btn{font-size:11px;color:#25D366;cursor:pointer;background:none;border:.5px solid #25D366;padding:4px 10px;border-radius:var(--r-xs);white-space:nowrap}
.wpp-btn:hover{background:rgba(37,211,102,.1)}

/* Grade fixa */
.grade-screen{padding:14px}
.gsec{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;margin-top:16px}
.gsec:first-child{margin-top:0}
.ga-card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;border:.5px solid var(--border)}
.ga-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ga-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.ga-name{font-size:13px;font-weight:600;flex:1}
.ga-loc{font-size:10px;font-family:var(--mono);font-weight:700;padding:3px 8px;border-radius:var(--r-xs)}
.ga-loc.fs{background:var(--fs-lt);color:var(--fs-dk)}.ga-loc.ic{background:var(--ic-lt);color:var(--ic-dk)}
.ga-loc.pr{background:var(--pr-lt);color:var(--pr-dk)}.ga-loc.cd{background:var(--cd-lt);color:var(--cd-dk)}
.dias-wrap{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.dia-btn{width:36px;height:36px;border-radius:50%;border:.5px solid var(--border);background:var(--bg3);cursor:pointer;font-size:10px;font-weight:700;color:var(--muted);transition:all .15s;font-family:var(--mono)}
.dia-btn.sel{background:var(--g1);color:#000;border-color:var(--g1)}
.ga-selects{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ga-select-wrap{display:flex;flex-direction:column;gap:4px;flex:1;min-width:100px}
.ga-select-lbl{font-size:10px;color:var(--muted);font-weight:500}
.ga-sel{padding:7px 10px;border:.5px solid var(--border);border-radius:var(--r-sm);font-size:12px;outline:none;background:var(--bg3);color:var(--text);width:100%;cursor:pointer}
.ga-sel:focus{border-color:var(--g1)}
.ga-save-btn{padding:8px 14px;background:var(--g1);color:#000;border:none;border-radius:var(--r-sm);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;align-self:flex-end}
.ga-slots-preview{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:.5px solid var(--border)}
.ga-slot-tag{font-size:10px;font-family:var(--mono);padding:3px 8px;border-radius:var(--r-xs);font-weight:600}
.ga-slot-tag.fs{background:var(--fs-lt);color:var(--fs-dk)}.ga-slot-tag.ic{background:var(--ic-lt);color:var(--ic-dk)}
.ga-slot-tag.pr{background:var(--pr-lt);color:var(--pr-dk)}.ga-slot-tag.cd{background:var(--cd-lt);color:var(--cd-dk)}
/* Blocos no calendário */
.cal-bloco{display:flex;flex-direction:column;align-items:flex-start;padding:6px 10px;border-radius:var(--r-sm);margin-bottom:4px;border-left:3px solid;position:relative;cursor:pointer;transition:opacity .1s}
.cal-bloco:hover{opacity:.85}
.cal-bloco.fs{background:var(--fs-lt);border-color:var(--fs-dk)}.cal-bloco.ic{background:var(--ic-lt);border-color:var(--ic-dk)}
.cal-bloco.pr{background:var(--pr-lt);border-color:var(--pr-dk)}.cal-bloco.cd{background:var(--cd-lt);border-color:var(--cd-dk)}
.bloco-hora{font-size:10px;font-family:var(--mono);font-weight:700;opacity:.7}
.bloco-nome{font-size:12px;font-weight:600;margin-top:1px}
.bloco-dur{font-size:10px;opacity:.6;margin-top:1px}
.bloco-del{position:absolute;top:4px;right:6px;font-size:14px;color:var(--faint);background:none;border:none;cursor:pointer;line-height:1}
.bloco-del:hover{color:var(--red)}
.dd-add-btn{width:100%;padding:8px;border:.5px dashed var(--border2);border-radius:var(--r-sm);background:none;color:var(--muted);cursor:pointer;font-size:12px;margin-top:6px;transition:all .1s}
.dd-add-btn:hover{border-color:var(--g1);color:var(--g1);background:var(--g4)}
/* Modal edição de aula */
.edit-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:400;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.edit-modal-bg.open{display:flex}
.edit-modal{background:var(--bg2);border-radius:var(--r);padding:20px;width:100%;max-width:360px;border:.5px solid var(--border);animation:fadeIn .2s}
.edit-modal-title{font-size:15px;font-weight:700;margin-bottom:4px}
.edit-modal-sub{font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:16px}
.edit-row{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.edit-lbl{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.edit-sel{padding:9px 11px;border:.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;outline:none;background:var(--bg3);color:var(--text);width:100%;cursor:pointer}
.edit-sel:focus{border-color:var(--g1)}
.edit-scope{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.scope-opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:var(--r-sm);border:.5px solid var(--border);cursor:pointer;transition:all .15s}
.scope-opt.sel{border-color:var(--g1);background:var(--g4)}
.scope-opt-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.scope-opt.sel .scope-opt-radio{border-color:var(--g1);background:var(--g1)}
.scope-opt.sel .scope-opt-radio::after{content:"";width:6px;height:6px;border-radius:50%;background:#000}
.scope-opt-text{flex:1}
.scope-opt-title{font-size:12px;font-weight:600}
.scope-opt-sub{font-size:11px;color:var(--muted);margin-top:2px}
.edit-btns{display:flex;gap:8px}
.edit-confirm{flex:1;padding:11px;background:var(--g1);color:#000;border:none;border-radius:var(--r-sm);font-size:13px;font-weight:700;cursor:pointer}
.edit-confirm:hover{background:var(--g5)}
.edit-cancel{padding:11px 16px;background:none;color:var(--muted);border:.5px solid var(--border);border-radius:var(--r-sm);font-size:13px;cursor:pointer}
.edit-del-btn{width:100%;padding:10px;background:none;color:var(--red);border:.5px solid var(--red-lt);border-radius:var(--r-sm);font-size:12px;cursor:pointer;margin-bottom:8px}
.edit-del-btn:hover{background:var(--red-lt)}

</style>
</head>
<body>
<div class="splash" id="splash">

  <div class="splash-sub">Gestão · 2026</div>
  <div class="splash-ring"></div>
</div>
<div class="app">
  <div class="hdr">
    <div class="hdr-top">
      <div><div class="hdr-logo">Léo<span>Personal</span></div><div class="hdr-sub" id="hdr-sub">Gestão · 2026</div></div>
      <div><div class="hdr-date" id="hdr-date"></div><div class="hdr-count" id="hdr-count"></div></div>

    <div class="hdr-kpis" id="hdr-kpis"></div>
    <div class="month-strip" id="month-strip"></div>

    <button class="nb" onclick="goScreen('reg',this)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>Registro</button>
    <button class="nb" onclick="goScreen('alunos',this)"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Alunos</button>

    <button class="nb" onclick="goScreen('grade',this)"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="13" x2="8" y2="17"/><line x1="12" y1="13" x2="12" y2="17"/><line x1="16" y1="13" x2="16" y2="17"/></svg>Grade</button>
    <button class="nb" onclick="goScreen('desp',this)"><svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Despesas</button>
    <button class="nb" onclick="goScreen('dash',this)"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9"/><rect x="10" y="7" width="4" height="14"/><rect x="17" y="3" width="4" height="18"/></svg>Dashboard</button>
  </div>
</div>
<div class="modal-bg" id="modal-bg" onclick="bgClick(event)">
  <div class="modal"><div class="mh"></div><div class="m-title" id="m-title">Quem treinou?</div><div class="m-sub" id="m-sub"></div><input class="m-search" id="m-search" placeholder="Buscar aluno..." oninput="filterM()"><div class="m-list" id="m-list"></div><div class="m-clear" onclick="clearSlot()">✕ Limpar slot</div></div>
</div>
<div class="ficha-modal" id="ficha-modal">
  <div class="ficha-inner">
    <div class="ficha-hdr"><div class="ficha-av" id="f-av"></div><div style="flex:1"><div class="ficha-hdr-title" id="f-title">Ficha</div><div class="ficha-hdr-sub" id="f-sub"></div></div><button class="ficha-close" onclick="closeF()">×</button></div>
    <div class="ficha-tabs" id="ficha-tabs"></div>
    <div class="ficha-body" id="ficha-body"></div>
  </div>
</div>

<div class="edit-modal-bg" id="edit-modal-bg">
  <div class="edit-modal">
    <div class="edit-modal-title" id="em-title">Editar aula</div>
    <div class="edit-modal-sub" id="em-sub"></div>
    <div class="edit-row">
      <div class="edit-lbl">Aluno</div>
      <select class="edit-sel" id="em-aluno"></select>
    </div>
    <div class="edit-row">
      <div class="edit-lbl">Horário</div>
      <select class="edit-sel" id="em-hora"></select>
    </div>
    <div class="edit-row">
      <div class="edit-lbl">Duração</div>
      <select class="edit-sel" id="em-dur">
        <option value="30">30 minutos</option>

function presencaAluno(aId){

    const num=new Date(ANO,m+1,0).getDate();

      Object.values(slots).forEach(nC=>{if(nC===a.nome_c)cnt++;});

// Retorna aulas efetivas de um dia considerando grade + overrides
function aulasEfetivas(ano,mes,dia){
  const date=new Date(ano,mes,dia);
  const wd=date.getDay();
  const dateStr=`${ano}_${mes}_${dia}`;
  const resultado=[];

  alunos.forEach(a=>{
    const slots=grade[a.id]||[];
    slots.forEach((slot,si)=>{
      // Verificar se slot está ativo nesta data
      const desdeDate=slot.desde?new Date(slot.desde):new Date(ano,0,1);
      const ateDate=slot.ate?new Date(slot.ate):new Date(2099,0,1);
      if(date<desdeDate||date>ateDate)return;
      if(slot.dia!==wd)return;

      const ovrKey=`${a.id}_${dateStr}_${si}`;
      const ovr=overrides[ovrKey];
      if(ovr==="removed")return;
      resultado.push({
        alunoId:a.id,
        nomeC:a.nome_c,
        local:a.local,
        hora:ovr?ovr.hora:slot.hora,
        dur:ovr?ovr.dur:slot.dur,
        slotIdx:si,
        dateStr,
        isOverride:!!ovr
      });
    });
  });

  // Registros manuais no regCache (aulas não da grade)
  const regSlots=regCache[dk(ano,mes,dia)]||{};
  Object.entries(regSlots).forEach(([si,nomeC])=>{
    if(!nomeC)return;
    const jaTemGrade=resultado.some(r=>r.nomeC===nomeC);
    if(!jaTemGrade){
      const a=gAN(nomeC);
      resultado.push({
        alunoId:a?a.id:"",
        nomeC,
        local:a?a.local:"FS",
        hora:HORARIOS[parseInt(si)]||"?",
        dur:60,
        slotIdx:-1,
        dateStr,
        isManual:true
      });
    }
  });

  return resultado.sort((a,b)=>{
    const toMin=h=>{const[hr,mn]=h.split(":").map(Number);return hr*60+(mn||0);};
    return toMin(a.hora)-toMin(b.hora);
  });
}

  if(!_diasSel[aid])_diasSel[aid]=new Set();

  const btn=document.querySelector(`[data-aid="${aid}"][data-wd="${wd}"]`);

function addSlotGrade(aid){
  if(!_diasSel[aid]||!_diasSel[aid].size){toast("Selecione pelo menos 1 dia");return;}
  const hora=document.getElementById("gh-"+aid)?.value||"7:00";

    grade[aid]=grade[aid].filter(s=>s.dia!==wd);

  document.querySelectorAll(`[data-aid="${aid}"]`).forEach(b=>b.classList.remove("sel"));

function renderCal(){
  const num=new Date(ANO,curMes+1,0).getDate();
  const firstDay=new Date(ANO,curMes,1).getDay();
  let ddHTML="";
  if(selDay){
    const dateStr=dk(ANO,curMes,selDay);
    const aulas=aulasEfetivas(ANO,curMes,selDay);
    const tots={FS:0,IC:0,PR:0,CD:0,total:0};
    aulas.forEach(au=>{if(tots[au.local]!==undefined){tots[au.local]++;tots.total++;}});
    const badges=LOCS.filter(s=>tots[s]>0).map(s=>`<span class="dd-badge ${s.toLowerCase()}">${s} ${tots[s]}</span>`).join("");

    const blocos=aulas.map(au=>{
      const cl=au.local.toLowerCase();
      return`<div class="cal-bloco ${cl}" onclick="openEditModal({alunoId:'${au.alunoId}',nomeC:'${au.nomeC}',hora:'${au.hora}',dur:${au.dur},slotIdx:${au.slotIdx},dateStr:'${au.dateStr}',ano:${ANO},mes:${curMes},dia:${selDay}})">
        <div class="bloco-hora">${au.hora}</div>
        <div class="bloco-nome">${au.nomeC}</div>
        <div class="bloco-dur">${au.dur}min · ${au.local}</div>
      </div>`;
    }).join("");

    ddHTML=`<div class="day-detail">
      <div class="dd-title">
        <span>${selDay}/${p2(curMes+1)} · <span style="color:var(--g1)">${tots.total} aula${tots.total!==1?"s":""}</span></span>
        <div class="dd-badges">${badges}</div>
        <button class="dd-close" onclick="selDay=null;renderCal()">×</button>
      </div>
      ${blocos||`<div style="text-align:center;color:var(--faint);font-size:12px;padding:12px 0;font-style:italic">Nenhuma aula neste dia</div>`}
      <button class="dd-add-btn" onclick="openAddAula('${dateStr}')">+ Adicionar aula</button>
    </div>`;
  }

  let grid="";
  for(let i=0;i<firstDay;i++)grid+=`<div class="cal-day empty"></div>`;
  for(let d=1;d<=num;d++){
    const wd=new Date(ANO,curMes,d).getDay();
    const isW=wd===0||wd===6;
    const isT=d===TODAY.getDate()&&curMes===TODAY.getMonth();
    const isSel=d===selDay;
    const aulas=aulasEfetivas(ANO,curMes,d);
    const dots=aulas.slice(0,4).map(au=>`<div class="cdot ${au.local.toLowerCase()}"></div>`).join("");
    const cls=`cal-day${isW?" wknd":""}${isT?" today":""}${isSel&&!isT?" sel":""}${aulas.length?" has-a":""}`;
    grid+=`<div class="${cls}" onclick="${isW?"":"selDay="+d+";renderCal()"}"><span class="cal-day-num">${d}</span>${aulas.length?`<div class="cal-dots">${dots}</div><span class="cal-cnt">${aulas.length}</span>`:""}</div>`;
  }

  document.getElementById("cal-content").innerHTML=`
    <div class="cal-header">
      <div class="cal-title">${MPT[curMes]} ${ANO}</div>
      <div class="cal-nav">
        <button class="cal-nav-btn" onclick="prevMes()"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="cal-nav-btn" onclick="nextMes()"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
    </div>
    <div class="cal-grid-hdr">${DCAL.map(d=>`<div class="cal-dn">${d}</div>`).join("")}</div>
    <div class="cal-grid">${grid}</div>
    ${ddHTML}`;
}

function buildEvoChart(hist,field,label){
  const pts=hist.filter(h=>h[field]).map(h=>({v:parseFloat(h[field]),d:h.data||""}));
  if(pts.length<2)return"";
  const min=Math.min(...pts.map(p=>p.v)),max=Math.max(...pts.map(p=>p.v));
  const range=max-min||1;const W=300,H=70,pad=8;
  const x=i=>pad+(i/(pts.length-1))*(W-pad*2);
  const y=v=>H-pad-((v-min)/range)*(H-pad*2);
  const pathD=pts.map((p,i)=>`${i===0?"M":"L"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
  const areaD=`${pathD} L${x(pts.length-1).toFixed(1)},${H} L${x(0).toFixed(1)},${H} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="var(--g1)"/>`).join("");
  return`<div class="evo-card"><div class="evo-title">${label}</div>
    <svg width="100%" viewBox="0 0 ${W} ${H}" style="overflow:visible">
      <defs><linearGradient id="eg${field}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--g1)" stop-opacity=".3"/><stop offset="100%" stop-color="var(--g1)" stop-opacity="0"/></linearGradient></defs>
      <path d="${areaD}" fill="url(#eg${field})"/>
      <path d="${pathD}" fill="none" stroke="var(--g1)" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
    </svg>
    <div class="evo-labels"><span class="evo-lbl">${pts[0].d}</span><span class="evo-lbl" style="color:var(--g1);font-weight:600">${pts[pts.length-1].v}${field==="gord"?"%":"kg"}</span></div>
  </div>`;
}

    var al=aMap[g.id]||{},nome=al.nome_c||al.nome||g.id;
    var loc=(al.local||'').toUpperCase(),locL=(al.local||'').toLowerCase(),feita=regSet.has(g.id);
    var nC=feita?'#555':'#f0f0f0',nD=feita?'line-through':'none';
    return '<div style="display:flex;align-items:center;padding:8px 0;border-bottom:0.8px solid #2a2a2a;gap:10px;">'
      +'<input type="checkbox" class="mv2cb" data-id="'+g.id+'"'+(feita?' checked':'')+' style="width:16px;height:16px;accent-color:#00c896;cursor:pointer;flex-shrink:0;">'
      +'<span style="color:#555;font-size:10px;width:34px;">'+g.hora+'</span>'
      +'<span style="flex:1;font-size:13px;font-weight:500;color:'+nC+';text-decoration:'+nD+';">'+nome+'</span>'
      +'<span class="ts-loc '+locL+'" style="font-size:9px;padding:2px 7px;border-radius:4px;">'+loc+'</span>'
      +(feita?'<span style="font-size:9px;color:#00c896;font-weight:600;min-width:28px;text-align:right;">feita</span>':'<span style="min-width:28px;"></span>')
      +'</div>';
  }).join('');
  return '<div class="today-card"><div style="color:#00c896;font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:0.5px;">HOJE, '+h.dd+'/'+h.mm+'<span style="color:#444;font-weight:400;font-size:10px;margin-left:8px;">'+grade.length+' aulas</span></div>'+rows+'</div>';
}
async function _buildCobr(){
  var pags=await _get('gestao_pagamentos','?select=id,aluno_id,valor,mes,ano,status&status=in.(pendente,atrasado)&order=ano.asc,mes.asc');
  if(!pags||!pags.length)return '';
  var ids=[...new Set(pags.map(p=>p.aluno_id))].join(',');
  var alunos=await _get('gestao_alunos','?select=id,nome_c,nome,tel&id=in.('+ids+')');
  var aMap={};(alunos||[]).forEach(a=>aMap[a.id]=a);
  var now=new Date(),mN=['','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  var rows=pags.map(p=>{
    var al=aMap[p.aluno_id]||{},nome=al.nome_c||al.nome||'?';
    var diffD=Math.floor((now-new Date(p.ano+'-'+String(p.mes).padStart(2,'0')+'-01'))/86400000);
    var cor=diffD>30?'#ff4444':diffD>10?'#ff9800':'#888';
    var tel=(al.tel||'').replace(/\D/g,'');
    var wa=tel?'<a href="https://wa.me/55'+tel+'?text=Oi+'+encodeURIComponent(nome)+'%2C+lembrete+de+pagamento+'+p.mes+'%2F'+p.ano+'" target="_blank" style="font-size:10px;background:#1a3a1a;color:#25d366;border-radius:4px;padding:2px 8px;text-decoration:none;font-weight:600;">WA</a>':'';
    return '<div style="display:flex;align-items:center;padding:8px 0;border-bottom:0.8px solid #2a2a2a;gap:8px;"><span style="flex:1;font-size:13px;color:#f0f0f0;">'+nome+'</span><span style="font-size:10px;color:#888;">'+mN[p.mes]+'/'+p.ano+'</span><span style="font-size:10px;color:'+cor+';font-weight:600;min-width:26px;text-align:right;">'+diffD+'d</span>'+wa+'</div>';
  }).join('');
  return '<div class="today-card"><div style="color:#ff9800;font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:0.5px;">COBRANCAS PENDENTES<span style="color:#444;font-weight:400;font-size:10px;margin-left:8px;">'+pags.length+'</span></div>'+rows+'</div>';
}
async function _buildSem(){
  var n=new Date(),dow=n.getDay(),h=_hj();
  var regs=await _get('gestao_registro','?select=dia&ano=eq.'+h.ano+'&mes=eq.'+h.mes0);
  var sN=['Seg','Ter','Qua','Qui','Sex','Sab','Dom'];
  var wS=new Date(n);wS.setDate(n.getDate()-(dow===0?6:dow-1));wS.setHours(0,0,0,0);
  var wE=new Date(wS);wE.setDate(wS.getDate()+6);wE.setHours(23,59,59,0);
  var cont=[0,0,0,0,0,0,0];
  (regs||[]).forEach(r=>{var d=new Date(h.ano,h.mes0-1,r.dia);if(d>=wS&&d<=wE){var di=d.getDay();cont[di===0?6:di-1]++;}});
  var total=cont.reduce((a,b)=>a+b,0),hiIdx=dow===0?6:dow-1;
  var cols=sN.map((d,i)=>{
    var iH=i===hiIdx,bg=iH?'#0d2e26':'transparent',brd=iH?'1px solid #00c896':'1px solid #2a2a2a',cor=iH?'#00c896':cont[i]>0?'#f0f0f0':'#333';
    return '<div style="flex:1;text-align:center;background:'+bg+';border:'+brd+';border-radius:8px;padding:6px 2px;"><div style="font-size:8px;color:#555;margin-bottom:3px;">'+d+'</div><div style="font-size:16px;font-weight:700;color:'+cor+';">'+cont[i]+'</div></div>';
  }).join('');
  return '<div class="today-card"><div style="color:#888;font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:0.5px;">SEMANA ATUAL<span style="color:#00c896;font-weight:600;font-size:10px;margin-left:8px;">'+total+' aulas</span></div><div style="display:flex;gap:4px;">'+cols+'</div></div>';
}
async function _buildRenov(){
  var alunos=await _get('gestao_alunos','?select=id,nome_c,nome,criado_em&ativo=eq.true');
  if(!alunos||!alunos.length)return '';
  var now=new Date(),ms=[3,6,12,18,24],alerts=[];
  alunos.forEach(a=>{if(!a.criado_em)return;var ini=new Date(a.criado_em),meses=(now.getFullYear()-ini.getFullYear())*12+(now.getMonth()-ini.getMonth());ms.forEach(m=>{var diff=m-meses;if(diff>=0&&diff<=1)alerts.push({nome:a.nome_c||a.nome,m,diff});});});
  if(!alerts.length)return '';
  var rows=alerts.map(a=>'<div style="display:flex;align-items:center;padding:7px 0;border-bottom:0.8px solid #2a2a2a;gap:8px;"><span style="flex:1;font-size:13px;color:#f0f0f0;">'+a.nome+'</span><span style="font-size:10px;color:#888;">'+a.m+' meses</span><span style="font-size:9px;color:#ff9800;font-weight:600;">'+(a.diff===0?'este mes':'proximo mes')+'</span></div>').join('');
  return '<div class="today-card"><div style="color:#ff9800;font-size:11px;font-weight:700;margin-bottom:10px;letter-spacing:0.5px;">RENOVACAO EM BREVE<span style="color:#444;font-weight:400;font-size:10px;margin-left:8px;">'+alerts.length+'</span></div>'+rows+'</div>';
}
document.addEventListener('change',function(e){
  var cb=e.target;if(!cb.classList.contains('mv2cb'))return;
  window._mv2Reg(cb.dataset.id,cb.checked);
});
window._mv2Reg=async function(alunoId,checked){
  var h=_hj(),cb=document.querySelector('.mv2cb[data-id="'+alunoId+'"]');
  if(cb)cb.disabled=true;
  if(checked){
    var regs=await _get('gestao_registro','?select=slot&ano=eq.'+h.ano+'&mes=eq.'+h.mes0+'&dia=eq.'+h.dia);
    var slots=(regs||[]).map(r=>r.slot||0),slot=slots.length?Math.max(...slots)+1:0;
    await fetch(_SB+'/rest/v1/gestao_registro',{method:'POST',headers:{..._H,'Prefer':'return=minimal'},body:JSON.stringify({aluno_id:alunoId,ano:h.ano,mes:h.mes0,dia:h.dia,slot:slot})});
  }else{
    var regs=await _get('gestao_registro','?select=id&aluno_id=eq.'+alunoId+'&ano=eq.'+h.ano+'&mes=eq.'+h.mes0+'&dia=eq.'+h.dia);
    if(regs&&regs.length)await fetch(_SB+'/rest/v1/gestao_registro?id=eq.'+regs[0].id,{method:'DELETE',headers:_H});
  }
  if(cb)cb.disabled=false;setTimeout(_mv2Run,300);
};
document.addEventListener('click',function(e){
  var c=e.target.closest('[onclick*="openF"]');
  if(c){var m=(c.getAttribute('onclick')||'').match(/openF\(['"]([\w]+)['"]\)/);if(m)window._mv2AlunoId=m[1];}
});
var _obs=new MutationObserver(function(){
  var modal=document.getElementById('ficha-modal');if(!modal)return;
  var open=modal.style.display&&modal.style.display!=='none'&&!modal.classList.contains('hidden');
  if(!open||document.getElementById('mv2-notas'))return;
  var div=document.createElement('div');div.id='mv2-notas';
  div.style.cssText='margin:16px;padding:12px;background:#141414;border:0.8px solid #2a2a2a;border-radius:10px;';
  div.innerHTML='<div style="font-size:10px;color:#00c896;font-weight:700;margin-bottom:8px;">NOTAS RAPIDAS</div>'
    +'<textarea id="mv2-nota-ta" placeholder="Observacoes, preferencias..." style="width:100%;height:80px;background:#0a0a0a;color:#f0f0f0;border:0.8px solid #2a2a2a;border-radius:6px;padding:8px;font-size:12px;resize:vertical;box-sizing:border-box;"></textarea>'
    +'<button id="mv2-nota-btn" style="margin-top:8px;background:#00c896;color:#000;border:none;border-radius:6px;padding:6px 16px;font-size:11px;font-weight:700;cursor:pointer;">Salvar nota</button>';
  modal.insertBefore(div,modal.firstChild);window._mv2CarregaNota();
  document.getElementById('mv2-nota-btn').addEventListener('click',window._mv2SalvaNota);
});
_obs.observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']});
window._mv2CarregaNota=async function(){
  var id=window._mv2AlunoId;if(!id)return;
  var r=await _get('gestao_alunos','?select=saude&id=eq.'+id);
  var ta=document.getElementById('mv2-nota-ta');if(!ta)return;
  var saude=(r&&r[0]&&r[0].saude)||{};ta.value=saude.notas_rapidas||'';
};
window._mv2SalvaNota=async function(){
  var id=window._mv2AlunoId;if(!id)return;
  var ta=document.getElementById('mv2-nota-ta');if(!ta)return;
  var r=await _get('gestao_alunos','?select=saude&id=eq.'+id);
  var saude=(r&&r[0]&&r[0].saude)||{};saude.notas_rapidas=ta.value;
  await fetch(_SB+'/rest/v1/gestao_alunos?id=eq.'+id,{method:'PATCH',headers:{..._H,'Prefer':'return=minimal'},body:JSON.stringify({saude:saude})});
  var btn=document.getElementById('mv2-nota-btn');
  if(btn){btn.textContent='Salvo!';setTimeout(function(){btn.textContent='Salvar nota';},1500);}
};
async function _mv2Run(){
  var hc=document.getElementById('home-content');if(!hc)return;
  var old=document.getElementById('mv2-wrapper');if(old)old.remove();
  var orig=hc.querySelector('.today-card');if(orig)orig.style.display='none';
  var results=await Promise.all([_buildHoje(),_buildCobr(),_buildSem(),_buildRenov()]);
  var w=document.createElement('div');w.id='mv2-wrapper';w.style.cssText='display:flex;flex-direction:column;gap:14px;margin-bottom:14px;';
  w.innerHTML=results.filter(Boolean).join('');
  var ref=hc.querySelector('.today-card');hc.insertBefore(w,ref||hc.firstChild);
}
window._mv2Run=_mv2Run;
var _rh0=window.renderHome;window.renderHome=function(){if(_rh0)_rh0();setTimeout(_mv2Run,300);};
setTimeout(_mv2Run,1000);
})();
</script>
